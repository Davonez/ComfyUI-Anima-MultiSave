[project]
name = "comfyui-anima-multisave"
version = "1.2.0"
description = "Anima Multi-Save: multi-port IMAGE saver that keeps the port that ran furthest (12 fixed ports or dynamic ports) and strips PNG/JPEG/WebP metadata by default."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "koivis" }]
keywords = ["comfyui", "custom-nodes", "save", "image", "metadata", "anima"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Davonez/ComfyUI-Anima-MultiSave"
Repository = "https://github.com/Davonez/ComfyUI-Anima-MultiSave"
"Issue Tracker" = "https://github.com/Davonez/ComfyUI-Anima-MultiSave/issues"

# ComfyUI Registry 的展示信息（按需补 PublisherId 后即可 comfy node publish）
[tool.comfy]
DisplayName = "Anima Multi-Save"
